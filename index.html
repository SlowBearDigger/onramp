<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Content Security Policy.
         GitHub Pages doesn't let us set CSP via headers, so we ship it
         via meta. directives like frame-ancestors and X-Frame-Options
         are ignored in meta (browser-spec) — those would need a real
         header (move to Cloudflare Pages or a CDN front to enable).
         meta CSP is enforced for everything else. -->
    <meta http-equiv="Content-Security-Policy" content="
      default-src 'self';
      script-src 'self';
      script-src-attr 'unsafe-hashes' 'sha256-MhtPZXr7+LpJUY5qtMutB+qWfQtMaPccfe7QXtCcEYc=';
      style-src 'self' 'unsafe-inline' https://api.fontshare.com https://fonts.googleapis.com;
      font-src 'self' https://cdn.fontshare.com https://fonts.gstatic.com https://fonts.reown.com data:;
      img-src 'self' data: blob: https:;
      connect-src 'self' https://api.onoff.finance https://api.coingecko.com https://api.fontshare.com https://fonts.googleapis.com https://fonts.gstatic.com https://*.walletconnect.com https://*.walletconnect.org wss://*.walletconnect.com wss://*.walletconnect.org https://api.web3modal.org https://pulse.walletconnect.org https://*.publicnode.com https://*.alchemy.com https://*.infura.io https://api.mainnet-beta.solana.com https://*.solana.com;
      frame-src https://global.transak.com https://global-stg.transak.com https://staging-global.transak.com https://widget.mtpelerin.com https://app.topperpay.com https://app.sandbox.topperpay.com https://verify.walletconnect.com https://verify.walletconnect.org https://secure.walletconnect.com https://secure.walletconnect.org;
      worker-src 'self';
      manifest-src 'self';
      object-src 'none';
      base-uri 'self';
      form-action 'self';
      upgrade-insecure-requests;
    " />
    <!-- script-src-attr 'unsafe-hashes' + sha256-... allows ONLY the
         specific inline event handler `this.media='all'` used by the
         non-blocking font links below. nothing else inline can run.
         this is the documented CSP escape hatch for legitimate inline
         handlers without opening up to all unsafe-inline. -->

    <title>On-Ramp | Premium Crypto Gateway</title>
    <meta name="description" content="Buy and sell crypto in seconds — no signup required. Best rates guaranteed through smart routing across trusted on-ramp providers." />
    <meta name="theme-color" content="#f9f9f9" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="On-Ramp" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://api.fontshare.com" crossorigin />
    <link rel="preconnect" href="https://cdn.fontshare.com" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- non-blocking font load: browser fetches the CSS immediately,
         media="print" prevents it from applying to screen, the inline
         onload swaps it to "all" the moment the CSS finishes
         downloading. CSP allows ONLY this specific handler value via
         script-src-attr 'unsafe-hashes' + sha256 (computed above).
         applying via main.jsx instead caused a 0.8 CLS regression
         because the swap fired after the JS bundle parsed (seconds
         later on mobile) — too late to avoid a font-flip reflow. -->
    <link
      rel="stylesheet"
      href="https://api.fontshare.com/v2/css?f[]=switzer@400,500,600,700,800&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=switzer@400,500,600,700,800&display=swap" />
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap" />
    </noscript>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
