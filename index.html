<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Content Security Policy.
         GitHub Pages does not let us set CSP via headers, so we ship it
         via meta. allowed sources:
         - self, blob/data for images + fonts
         - fontshare + google fonts CDNs (loaded by index.html non-blocking)
         - coingecko (live ticker fetch)
         - the deployed backend on Render (api + push + webhook URLs)
         - provider iframes (transak / mtpelerin / topper) for the widget
         - 'unsafe-inline' for styles is required by Tailwind 4 (it injects
           a single <style> tag at runtime). 'unsafe-inline' is NOT allowed
           for scripts — XSS payloads land neutered.
    -->
    <meta http-equiv="Content-Security-Policy" content="
      default-src 'self';
      script-src 'self';
      style-src 'self' 'unsafe-inline' https://api.fontshare.com https://fonts.googleapis.com;
      font-src 'self' https://cdn.fontshare.com https://fonts.gstatic.com data:;
      img-src 'self' data: blob: https:;
      connect-src 'self' https://onramp-backend.onrender.com https://api.coingecko.com https://api.fontshare.com https://fonts.googleapis.com https://fonts.gstatic.com;
      frame-src https://global.transak.com https://global-stg.transak.com https://staging-global.transak.com https://widget.mtpelerin.com https://app.topperpay.com https://app.sandbox.topperpay.com;
      worker-src 'self';
      manifest-src 'self';
      object-src 'none';
      base-uri 'self';
      form-action 'self';
      frame-ancestors 'none';
      upgrade-insecure-requests;
    " />
    <title>On-Ramp | Premium Crypto Gateway</title>
    <meta name="description" content="Buy and sell crypto in seconds — no signup required. Best rates guaranteed through smart routing across trusted on-ramp providers." />
    <meta name="theme-color" content="#f9f9f9" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="On-Ramp" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://api.fontshare.com" crossorigin />
    <link rel="preconnect" href="https://cdn.fontshare.com" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- non-blocking font load: media="print" defers parse, onload swaps to "all".
         the noscript fallback keeps things working when JS is disabled.
         - Switzer (display + body) from fontshare CDN — free OFL.
         - JetBrains Mono (numeric / addresses) from google fonts — free OFL. -->
    <link
      rel="stylesheet"
      href="https://api.fontshare.com/v2/css?f[]=switzer@400,500,600,700,800&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=switzer@400,500,600,700,800&display=swap" />
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap" />
    </noscript>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
